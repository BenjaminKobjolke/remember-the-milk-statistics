[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remember-the-milk-statistics"
version = "0.1.0"
description = "Snapshots the todo count of a Remember The Milk smart list into SQLite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "rtmilk @ git+https://github.com/BenjaminKobjolke/rtmilk.git",
]

[project.scripts]
rtm-statistics = "rtm_statistics.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rtm_statistics"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["rtmilk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
]
