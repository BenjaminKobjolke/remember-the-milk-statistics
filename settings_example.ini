[rtm]
# Remember The Milk API credentials
# Get your API key and shared secret from: https://www.rememberthemilk.com/services/api/keys.rtm
api_key = your_api_key_here
shared_secret = your_shared_secret_here
# Filled in automatically by sign_in.bat
token =

[tracking]
# Name of the RTM smart list to count. Its filter is read from RTM on every run;
# the "completed today" query is derived from the same filter.
smart_list = My Smart List
# Optional: own RTM search for the "completed" count. Leave empty to derive it from the
# smart list filter (status:incomplete -> status:completed, plus AND completed:today).
completed_filter =

[output]
# SQLite file the snapshots are appended to (absolute or relative path)
database = data/statistics.sqlite

[logging]
# DEBUG, INFO, WARNING or ERROR
level = INFO
